name: Build Upgrader Mod

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Forge 1.20.1 build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build mod
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon 2>&1 | tee build.log

      - name: Verify Java 17 mod artifact
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import pathlib, struct, zipfile
          version = next(line.split('=', 1)[1] for line in pathlib.Path('gradle.properties').read_text().splitlines() if line.startswith('mod_version='))
          jar = pathlib.Path('build/libs') / f'upgradermod-{version}.jar'
          with zipfile.ZipFile(jar) as z:
              classes = [n for n in z.namelist() if n.endswith('.class')]
              assert len(classes) >= 30, f'Only {len(classes)} classes'
              for name in classes:
                  data = z.read(name)
                  assert len(data) > 8 and data[:4] == bytes.fromhex('cafebabe'), name
                  assert struct.unpack('>H', data[6:8])[0] == 61, name
              for name in ('SyncStatePacket', 'SetTargetCountPacket', 'ChancePresetPacket'):
                  assert f'com/example/upgradermod/network/{name}.class' in classes
              toml = z.read('META-INF/mods.toml').decode()
              assert 'upgradermod' in toml and 'Popipok' in toml and version in toml
              z.read('assets/upgradermod/textures/item/upgrader.png')
              z.read('assets/upgradermod/lang/ru_ru.json')
          print(f'Verified {jar}: {len(classes)} Java 17 classes')
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'JAR_PATH={jar}\n')
          PYCODE

      - name: Publish build diagnostics to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BUILD_LOG: build.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.BUILD_LOG)
              ? fs.readFileSync(process.env.BUILD_LOG, 'utf8').slice(-50000)
              : 'build.log was not created';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `CI build diagnostics:\n\n\`\`\`text\n${log}\n\`\`\``
            });

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgradermod-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upgradermod-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
