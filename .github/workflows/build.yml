name: Build Upgrader Mod

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Forge 1.20.1 build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build mod
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon 2>&1 | tee build.log

      - name: Verify JAR contains compiled classes
        shell: bash
        run: |
          jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jar"
          test "$(unzip -l "$jar" | awk '/\.class$/ { count++ } END { print count + 0 }')" -gt 20
          echo "Built: $jar"

      - name: Publish build diagnostics to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BUILD_LOG: build.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.BUILD_LOG)
              ? fs.readFileSync(process.env.BUILD_LOG, 'utf8').slice(-50000)
              : 'build.log was not created';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `CI build diagnostics:\n\n\`\`\`text\n${log}\n\`\`\``
            });

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgradermod-build-log
          path: build.log
          if-no-files-found: warn

      - name: Publish verified JAR to branch
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          before_sha="${{ github.event.before }}"
          if test "$before_sha" = "0000000000000000000000000000000000000000"; then
            before_sha=$(git rev-list --max-parents=0 HEAD)
          fi
          changed_files=$(git diff --name-only "$before_sha" "$GITHUB_SHA")
          if ! printf '%s\n' "$changed_files" | grep -Eq '^(src/|build.gradle$|gradle.properties$|settings.gradle$|gradle/)'; then
            echo "This commit does not change sources or build inputs; keeping the verified JAR."
            exit 0
          fi

          jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jar"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$jar"
          if git diff --cached --quiet; then
            echo "The compiled JAR did not change."
            exit 0
          fi
          git commit -m "ci: publish verified Forge JAR"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upgradermod-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
