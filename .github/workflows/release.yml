name: Release Upgrader Mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew clean build --no-daemon

      - name: Verify Java 17 mod artifact
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import pathlib, struct, zipfile
          version = next(line.split('=', 1)[1] for line in pathlib.Path('gradle.properties').read_text().splitlines() if line.startswith('mod_version='))
          jar = pathlib.Path('build/libs') / f'upgradermod-{version}.jar'
          with zipfile.ZipFile(jar) as z:
              classes = [n for n in z.namelist() if n.endswith('.class')]
              assert len(classes) >= 40, f'Only {len(classes)} classes'
              for name in classes:
                  data = z.read(name)
                  assert len(data) > 8 and data[:4] == bytes.fromhex('cafebabe'), name
                  assert struct.unpack('>H', data[6:8])[0] == 61, name
              for name in ('SyncStatePacket', 'SetTargetCountPacket', 'ChancePresetPacket'):
                  assert f'com/example/upgradermod/network/{name}.class' in classes
              toml = z.read('META-INF/mods.toml').decode()
              assert 'upgradermod' in toml and 'Popipok' in toml and version in toml
              z.read('assets/upgradermod/textures/item/upgrader.png')
              z.read('assets/upgradermod/lang/ru_ru.json')
          print(f'Verified {jar}: {len(classes)} Java 17 classes')
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'JAR_PATH={jar}\n')
          PYCODE

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "$version"
          cat > /tmp/release-notes.md << 'NOTES'
          Рабочая сборка Upgrader Mod для Minecraft Forge 1.20.1 (Java 17), автор Popipok.

          **Установка:** скопируйте `upgradermod-VERSION.jar` в папку `mods` клиента и сервера (требуется Forge 47.x). `upgradermod.zip` — архив исходников проекта.

          ## Возможности
          - Рулетка апгрейда предметов с компасоподобным индикатором (кольца, деления, стрелка) в тёмной теме
          - Кнопки: КРУТИТЬ, количество цели -/+, пресеты шанса 30%/50%/80%, множители награды x1/x2/x4/x8/x10
          - Количество цели входит в стоимость и шанс; награда = цель x количество x множитель и корректно разбивается на несколько ItemStack
          - Пресеты шанса подбирают количество цели на сервере, подтверждённое значение синхронизируется клиенту
          - Каталог предметов с вертикальной прокруткой (вверх/вниз и колёсико), поиском и blacklist-фильтрацией
          - Постоянный blacklist: bedrock, barrier, апгрейдер и служебные/читерские предметы — не попадают в каталог, input slot, ставку и цель
          - Все расчёты шанса и результата спина выполняются только на сервере; клиент не предсказывает итог, поддельные пакеты отклоняются

          ## Сборка
          - Скомпилировано ForgeGradle на Temurin Java 17 в GitHub Actions, JAR проверен на наличие реальных классов
          NOTES
          sed -i "s/upgradermod-VERSION.jar/upgradermod-${version}.jar/g" /tmp/release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$JAR_PATH" upgradermod.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "$JAR_PATH" upgradermod.zip \
              --title "Upgrader Mod ${version} — Forge 1.20.1" \
              --notes-file /tmp/release-notes.md
          fi
